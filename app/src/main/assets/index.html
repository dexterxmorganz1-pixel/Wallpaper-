<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Wallpapers</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101019;color:#fff;font-family:Arial,sans-serif}
header{padding:24px 18px 12px}
h1{margin:0;font-size:28px}
p{color:#aaa}
input{width:100%;padding:14px;border:0;border-radius:12px;background:#252532;color:white;font-size:16px}
nav{display:flex;gap:10px;padding:14px;overflow:auto}
button{border:0;border-radius:20px;padding:10px 15px;background:#292938;color:white;white-space:nowrap}
button.active{background:#c7a6ff;color:#171322}
#gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.wall{width:100%;height:230px;object-fit:cover;border-radius:15px;background:#292938}
.item{position:relative}
.fav{position:absolute;top:8px;right:8px;background:#161622bb;font-size:20px}
.name{font-size:13px;color:#ddd;margin:6px 2px}
</style>
</head>
<body>
<header>
<h1>✦ Aura Wallpapers</h1>
<p>Find your next screen vibe.</p>
<input id="search" placeholder="Search wallpapers..." oninput="render()">
</header>
<nav>
<button class="active" onclick="category='All';render()">All</button>
<button onclick="category='Nature';render()">Nature</button>
<button onclick="category='Minimal';render()">Minimal</button>
<button onclick="category='Space';render()">Space</button>
<button onclick="category='Architecture';render()">Architecture</button>
<button onclick="category='Favorites';render()">♥ Favorites</button>
</nav>
<div id="gallery"></div>
<script>
const pics=[
["Misty Mountains","Nature","photo-1464822759023-fed622ff2c3b"],
["Ocean Blue","Nature","photo-1518837695005-2083093ee35b"],
["Forest Light","Nature","photo-1448375240586-882707db888b"],
["Desert Dunes","Nature","photo-1509316785289-025f5b846b35"],
["Pink Sky","Nature","photo-1470252649378-9c29740c9fa8"],
["Night Sky","Space","photo-1462331940025-496dfbfc7564"],
["Galaxy","Space","photo-1419242902214-272b3f66ee7a"],
["Moonlight","Space","photo-1446776811953-b23d57bd21aa"],
["Clean Lines","Minimal","photo-1494438639946-1ebd1d20bf85"],
["Soft Shapes","Minimal","photo-1518005020951-eccb494ad742"],
["Modern Building","Architecture","photo-1487958449943-2429e8be8625"],
["City Geometry","Architecture","photo-1480714378408-67cf0d13bc1b"]
];
let category='All';
function url(id){return 'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w=600&q=80'}
function favorites(){try{return JSON.parse(localStorage.getItem('auraFavs')||'[]')}catch(e){return []}}
function toggle(name){let f=favorites();f=f.includes(name)?f.filter(x=>x!==name):[...f,name];localStorage.setItem('auraFavs',JSON.stringify(f));render()}
function render(){
const q=document.getElementById('search').value.toLowerCase();
const f=favorites();
const filtered=pics.filter(p=>(category==='All'||(category==='Favorites'?f.includes(p[0]):p[1]===category))&&p[0].toLowerCase().includes(q));
document.getElementById('gallery').innerHTML=filtered.map(p=>`<div class="item"><img class="wall" loading="lazy" src="${url(p[2])}" alt="${p[0]}"><button class="fav" onclick="toggle('${p[0]}')">${f.includes(p[0])?'♥':'♡'}</button><div class="name">${p[0]}</div></div>`).join('');
}
render();
</script>
</body>
</html>
